<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Rounded Square Container in Pocari Blue -->
  <rect x="4" y="4" width="92" height="92" rx="20" fill="#005BAC" />
  
  <!-- Pocari Sweat Signature Dynamic Wave -->
  <path d="
    M 10 46
    C 24 46, 36 34, 52 34
    C 66 34, 76 42, 90 42
    L 90 48
    C 76 48, 64 39, 52 39
    C 38 39, 26 51, 10 51 Z
  " fill="#FFFFFF" />
  
  <path d="
    M 10 54
    C 22 54, 32 46, 44 46
    C 58 46, 68 56, 90 56
    L 90 60
    C 70 60, 60 51, 44 51
    C 30 51, 20 59, 10 59 Z
  " fill="#FFFFFF" opacity="0.85" />
  
  <!-- "POCARI" Typography -->
  <text x="50" y="30" font-family="'Arial Black', Arial, sans-serif" font-size="10.5" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">POCARI</text>
  
  <!-- "SWEAT" Typography -->
  <text x="50" y="74" font-family="'Arial Black', Arial, sans-serif" font-size="9.5" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="1.5">SWEAT</text>
  <text x="50" y="84" font-family="Arial, sans-serif" font-size="4" font-weight="700" fill="#93C5FD" text-anchor="middle" letter-spacing="0.5">ION SUPPLY DRINK</text>
</svg>
