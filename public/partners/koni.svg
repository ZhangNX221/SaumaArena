  <circle cx="39" cy="58" r="7" fill="none" stroke="#0284C7" stroke-width="2" />
  <circle cx="50" cy="58" r="7" fill="none" stroke="#1E293B" stroke-width="2" />
  <circle cx="61" cy="58" r="7" fill="none" stroke="#DC2626" stroke-width="2" />
  <circle cx="44.5" cy="64" r="7" fill="none" stroke="#EAB308" stroke-width="2" />
  <circle cx="55.5" cy="64" r="7" fill="none" stroke="#16A34A" stroke-width="2" />
  
  <!-- KONI Typography Badge -->
  <rect x="26" y="76" width="48" height="14" rx="4" fill="#DC2626" />
  <text x="50" y="87" font-family="Arial, sans-serif" font-size="10" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="1.5">KONI</text>
</svg>
